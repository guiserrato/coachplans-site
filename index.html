<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Coach practice plans</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      let saved = "";
      try {
        saved = localStorage.getItem("coachplans:theme") || "";
      } catch {}
      const theme =
        param || saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.55;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(calc(100% - 24px), 920px); margin: 0 auto; padding: 20px 0 48px; }
    .topbar, .card {
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 16px;
      box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding: 12px 16px;
    }
    .topbar h1 { flex: 1; margin: 0; font-size: clamp(1.25rem, 5vw, 1.75rem); }
    .card { padding: clamp(18px, 5vw, 32px); }
    .unlock { max-width: 520px; margin: 12vh auto 0; }
    .unlock h1 { margin-top: 0; }
    .unlock p, .team-card p { color: var(--cp-text-muted); }
    .field { display: grid; gap: 8px; margin-top: 20px; }
    .field input {
      width: 100%;
      padding: 12px;
      color: var(--cp-text);
      background: var(--cp-bg-elevated);
      border: 1px solid var(--cp-border-strong);
      border-radius: 0.625rem;
    }
    .primary, .secondary, .team-link {
      border-radius: 0.625rem;
      padding: 10px 14px;
      font-weight: 650;
    }
    .primary {
      margin-top: 12px;
      color: var(--cp-accent-fg);
      background: var(--cp-accent);
      border: 1px solid var(--cp-accent);
    }
    .primary:hover { background: var(--cp-accent-hover); }
    .secondary {
      color: var(--cp-text);
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
    }
    .icon-button {
      min-width: 42px;
      padding-inline: 12px;
      font-size: 1.2rem;
      line-height: 1;
    }
    .teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .team-card {
      --team-border: var(--team-border-light);
      --team-logo-surface: var(--team-logo-surface-light);
      border-top: 5px solid var(--team-border);
    }
    html[data-theme="dark"] .team-card {
      --team-border: var(--team-border-dark);
      --team-logo-surface: var(--team-logo-surface-dark);
    }
    .team-heading { display: flex; align-items: center; gap: 14px; }
    .team-heading h2 { margin: 0; }
    .team-logo-link {
      width: 64px;
      height: 64px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      padding: 3px;
      overflow: hidden;
      background: var(--team-logo-surface);
      border: 2px solid var(--team-border);
      border-radius: 0.625rem;
    }
    .team-logo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
    .team-card[data-team="golden-warriors"] .team-logo { filter: brightness(0); }
    .team-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .team-link {
      display: inline-block;
      color: var(--cp-text);
      background: var(--cp-surface-soft);
      border: 1px solid var(--team-border);
      text-decoration: none;
    }
    .team-link:hover { background: var(--cp-bg-elevated); }
    .error { min-height: 24px; color: var(--cp-danger); margin-top: 12px; }
    .hidden { display: none !important; }
    @media (max-width: 560px) {
      .shell { width: min(calc(100% - 16px), 920px); padding-top: 8px; }
      .topbar { position: sticky; top: 4px; z-index: 2; }
      .team-link { flex: 1; text-align: center; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section id="unlock" class="card unlock">
      <h1>Coach practice plans</h1>
      <p>Open your private coach link or enter the shared coach password.</p>
      <form id="unlock-form">
        <label class="field">
          <span>Coach password</span>
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="primary" type="submit">View teams</button>
        <div id="error" class="error" role="alert"></div>
      </form>
    </section>

    <section id="app" class="hidden">
      <header class="topbar">
        <h1>Coach practice plans</h1>
        <button id="theme-button" class="secondary icon-button" type="button" aria-label="Switch theme" title="Switch theme">💡</button>
      </header>
      <div id="teams" class="teams"></div>
    </section>
  </main>

  <script>
    const storageKey = "coachplans:coach:secret";
    const unlock = document.getElementById("unlock");
    const app = document.getElementById("app");
    const form = document.getElementById("unlock-form");
    const passwordInput = document.getElementById("password");
    const error = document.getElementById("error");
    const teamsContainer = document.getElementById("teams");
    const themeButton = document.getElementById("theme-button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      await unlockWith(passwordInput.value);
    });
    themeButton.addEventListener("click", toggleTheme);

    updateThemeButton();
    start();

    async function start() {
      const fragmentSecret = decodeURIComponent(location.hash.slice(1));
      const savedSecret = sessionStorage.getItem(storageKey);
      const secret = fragmentSecret || savedSecret;
      if (!secret) {
        passwordInput.focus();
        return;
      }
      await unlockWith(secret, Boolean(fragmentSecret));
    }

    async function unlockWith(secret, removeFragment = false) {
      setError("");
      try {
        const response = await fetch("coach-payload.json", { cache: "no-store" });
        if (!response.ok) throw new Error("Unable to load coach plans.");
        const payload = await decryptPayload(await response.json(), secret);
        renderTeams(payload.teams);
        sessionStorage.setItem(storageKey, secret);
        if (removeFragment) history.replaceState(null, "", location.pathname + location.search);
        unlock.classList.add("hidden");
        app.classList.remove("hidden");
      } catch {
        sessionStorage.removeItem(storageKey);
        setError("That coach password did not work.");
        unlock.classList.remove("hidden");
        app.classList.add("hidden");
        passwordInput.select();
      }
    }

    function renderTeams(teams) {
      const cards = teams.map((team) => {
        const card = document.createElement("article");
        card.className = "card team-card";
        card.dataset.team = team.slug;
        card.style.setProperty("--team-border-light", team.borderLight);
        card.style.setProperty("--team-border-dark", team.borderDark);
        card.style.setProperty("--team-logo-surface-light", team.logoSurfaceLight);
        card.style.setProperty("--team-logo-surface-dark", team.logoSurfaceDark);

        const headingRow = document.createElement("div");
        headingRow.className = "team-heading";
        const logoLink = createTeamLink("", team, "");
        logoLink.className = "team-logo-link";
        logoLink.setAttribute("aria-label", `${team.name} home`);
        logoLink.title = `${team.name} home`;
        const logo = document.createElement("img");
        logo.className = "team-logo";
        logo.src = team.logo;
        logo.alt = `${team.name} logo`;
        logoLink.append(logo);
        const heading = document.createElement("h2");
        heading.textContent = team.name;
        headingRow.append(logoLink, heading);
        const detail = document.createElement("p");
        detail.textContent = team.latestPlan
          ? `Latest plan: Week ${team.latestPlan.week}, ${team.latestPlan.year}`
          : "No weekly plans are available yet.";
        const actions = document.createElement("div");
        actions.className = "team-actions";
        actions.append(createTeamLink("Latest practice plan", team, team.latestPlan?.id || ""));
        card.append(headingRow, detail, actions);
        return card;
      });
      teamsContainer.replaceChildren(...cards);
    }

    function createTeamLink(label, team, planId) {
      const link = document.createElement("a");
      link.className = "team-link";
      link.textContent = label;
      const url = new URL(`${team.slug}/`, location.href);
      if (planId) url.searchParams.set("plan", planId);
      url.hash = encodeURIComponent(team.secret);
      link.href = url.href;
      if (!planId && label && !team.latestPlan) {
        link.classList.add("hidden");
      }
      return link;
    }

    function toggleTheme() {
      const theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = theme;
      try {
        localStorage.setItem("coachplans:theme", theme);
      } catch {}
      updateThemeButton();
    }

    function updateThemeButton() {
      const dark = document.documentElement.dataset.theme === "dark";
      themeButton.setAttribute("aria-pressed", String(dark));
      const label = dark ? "Switch to light mode" : "Switch to dark mode";
      themeButton.setAttribute("aria-label", label);
      themeButton.title = label;
    }

    async function decryptPayload(encrypted, secret) {
      const encoder = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        encoder.encode(secret),
        "PBKDF2",
        false,
        ["deriveKey"],
      );
      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          hash: "SHA-256",
          salt: fromBase64(encrypted.salt),
          iterations: encrypted.iterations,
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"],
      );
      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: fromBase64(encrypted.iv), tagLength: 128 },
        key,
        fromBase64(encrypted.data),
      );
      return JSON.parse(new TextDecoder().decode(decrypted));
    }

    function fromBase64(value) {
      return Uint8Array.from(atob(value), (character) => character.charCodeAt(0));
    }

    function setError(message) {
      error.textContent = message;
    }
  </script>
</body>
</html>
