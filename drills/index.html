<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Soccer drill catalog</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      let saved = "";
      try {
        saved = localStorage.getItem("coachplans:theme") || "";
      } catch {}
      const theme =
        param || saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.55;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: var(--cp-link); }
    .shell { width: min(calc(100% - 24px), 920px); margin: 0 auto; padding: 20px 0 48px; }
    .topbar, .card {
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 16px;
      box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 12px 16px;
    }
    .topbar h1 { flex: 1; margin: 0; font-size: clamp(1.25rem, 5vw, 1.75rem); }
    .card { padding: clamp(18px, 5vw, 32px); }
    .unlock { max-width: 520px; margin: 12vh auto 0; }
    .unlock h1 { margin-top: 0; }
    .unlock p { color: var(--cp-text-muted); }
    .field { display: grid; gap: 8px; margin-top: 20px; }
    .field input {
      width: 100%;
      padding: 12px;
      color: var(--cp-text);
      background: var(--cp-bg-elevated);
      border: 1px solid var(--cp-border-strong);
      border-radius: 0.625rem;
    }
    .primary, .secondary {
      border-radius: 0.625rem;
      padding: 10px 14px;
      font-weight: 650;
    }
    .primary {
      margin-top: 12px;
      color: var(--cp-accent-fg);
      background: var(--cp-accent);
      border: 1px solid var(--cp-accent);
    }
    .primary:hover { background: var(--cp-accent-hover); }
    .secondary {
      min-width: 42px;
      color: var(--cp-text);
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      font-size: 1.2rem;
      line-height: 1;
    }
    .document h1 { margin-top: 0; line-height: 1.2; }
    .document h2 { margin-top: 2rem; padding-bottom: 6px; border-bottom: 1px solid var(--cp-border); }
    .document h3 { margin-top: 1.5rem; }
    .document img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 16px auto;
      border-radius: 0.625rem;
    }
    .document table { width: 100%; border-collapse: collapse; overflow-x: auto; display: block; }
    .document th, .document td { border: 1px solid var(--cp-border); padding: 8px; text-align: left; }
    .document blockquote {
      margin-left: 0;
      padding-left: 16px;
      border-left: 4px solid var(--cp-accent);
      color: var(--cp-text-muted);
    }
    .error { min-height: 24px; color: var(--cp-danger); margin-top: 12px; }
    .unavailable-link { color: var(--cp-text-muted); }
    .hidden { display: none !important; }
    @media (max-width: 560px) {
      .shell { width: min(calc(100% - 16px), 920px); padding-top: 8px; }
      .topbar { position: sticky; top: 4px; z-index: 2; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section id="unlock" class="card unlock">
      <h1>Soccer drill catalog</h1>
      <p>Open the drills link from a team or coach page, or enter one of those passwords.</p>
      <form id="unlock-form">
        <label class="field">
          <span>Password</span>
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="primary" type="submit">View drills</button>
        <div id="error" class="error" role="alert"></div>
      </form>
    </section>

    <section id="app" class="hidden">
      <header class="topbar">
        <h1 id="page-title">Soccer drills</h1>
        <button id="catalog-button" class="secondary hidden" type="button" aria-label="Drill catalog" title="Drill catalog">☷</button>
        <a id="site-home" class="secondary" aria-label="Return to site home" title="Return to site home">⌂</a>
        <button id="theme-button" class="secondary" type="button" aria-label="Switch theme" title="Switch theme">💡</button>
      </header>
      <div id="content"></div>
    </section>
  </main>

  <script>
    const payloadFiles = [
      "payload-coach.json",
      "payload-panthers.json",
      "payload-golden-warriors.json",
    ];
    const storageKey = "coachplans:drills:secret";
    const unlock = document.getElementById("unlock");
    const app = document.getElementById("app");
    const form = document.getElementById("unlock-form");
    const passwordInput = document.getElementById("password");
    const error = document.getElementById("error");
    const content = document.getElementById("content");
    const pageTitle = document.getElementById("page-title");
    const catalogButton = document.getElementById("catalog-button");
    const siteHome = document.getElementById("site-home");
    const themeButton = document.getElementById("theme-button");
    let payload = null;
    let activeSecret = "";

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      await unlockWith(passwordInput.value);
    });
    catalogButton.addEventListener("click", showCatalog);
    themeButton.addEventListener("click", toggleTheme);
    content.addEventListener("click", (event) => {
      const link = event.target.closest("[data-doc]");
      if (!link) return;
      event.preventDefault();
      showDocument(link.dataset.doc, link.dataset.anchor);
    });

    updateThemeButton();
    start();

    async function start() {
      const fragmentSecret = decodeURIComponent(location.hash.slice(1));
      const savedSecret = sessionStorage.getItem(storageKey);
      const secret = fragmentSecret || savedSecret;
      if (!secret) {
        passwordInput.focus();
        return;
      }
      await unlockWith(secret, Boolean(fragmentSecret));
    }

    async function unlockWith(secret, removeFragment = false) {
      setError("");
      try {
        payload = await decryptAnyPayload(secret);
        activeSecret = secret;
        sessionStorage.setItem(storageKey, secret);
        siteHome.href = new URL(payload.homePath, location.href).href + `#${encodeURIComponent(secret)}`;
        if (removeFragment) history.replaceState(null, "", location.pathname + location.search);
        unlock.classList.add("hidden");
        app.classList.remove("hidden");
        showCatalog();
      } catch {
        payload = null;
        activeSecret = "";
        sessionStorage.removeItem(storageKey);
        setError("That password did not work.");
        unlock.classList.remove("hidden");
        app.classList.add("hidden");
        passwordInput.select();
      }
    }

    async function decryptAnyPayload(secret) {
      const envelopes = await Promise.all(payloadFiles.map(async (file) => {
        const response = await fetch(file, { cache: "no-store" });
        if (!response.ok) throw new Error("Unable to load drills.");
        return response.json();
      }));
      for (const envelope of envelopes) {
        try {
          return await decryptPayload(envelope, secret);
        } catch {}
      }
      throw new Error("No drill bundle accepted that password.");
    }

    function showCatalog() {
      catalogButton.classList.add("hidden");
      pageTitle.textContent = "Soccer drills";
      document.title = "Soccer drill catalog";
      renderDocument(payload.catalogId, false);
    }

    function showDocument(id, anchor = "") {
      catalogButton.classList.remove("hidden");
      renderDocument(id, true, anchor);
    }

    function renderDocument(id, updateTitle, anchor = "") {
      const documentData = payload.documents[id];
      if (!documentData) return;
      if (updateTitle) {
        pageTitle.textContent = documentData.title;
        document.title = `${documentData.title} - Soccer drills`;
      }
      const article = document.createElement("article");
      article.className = "card document";
      article.innerHTML = documentData.html;
      if (updateTitle) article.querySelector("h1")?.remove();
      content.replaceChildren(article);
      if (anchor) {
        requestAnimationFrame(() => document.getElementById(anchor)?.scrollIntoView());
      } else {
        window.scrollTo({ top: 0 });
      }
    }

    function toggleTheme() {
      const theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = theme;
      try {
        localStorage.setItem("coachplans:theme", theme);
      } catch {}
      updateThemeButton();
    }

    function updateThemeButton() {
      const dark = document.documentElement.dataset.theme === "dark";
      themeButton.setAttribute("aria-pressed", String(dark));
      const label = dark ? "Switch to light mode" : "Switch to dark mode";
      themeButton.setAttribute("aria-label", label);
      themeButton.title = label;
    }

    async function decryptPayload(encrypted, secret) {
      const encoder = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        encoder.encode(secret),
        "PBKDF2",
        false,
        ["deriveKey"],
      );
      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          hash: "SHA-256",
          salt: fromBase64(encrypted.salt),
          iterations: encrypted.iterations,
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"],
      );
      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: fromBase64(encrypted.iv), tagLength: 128 },
        key,
        fromBase64(encrypted.data),
      );
      return JSON.parse(new TextDecoder().decode(decrypted));
    }

    function fromBase64(value) {
      return Uint8Array.from(atob(value), (character) => character.charCodeAt(0));
    }

    function setError(message) {
      error.textContent = message;
    }
  </script>
</body>
</html>
