<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Golden Warriors practice plans</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      let saved = "";
      try {
        saved = localStorage.getItem("coachplans:theme") || "";
      } catch {}
      const theme =
        param || saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
      --cp-team-frame: #111111;
      --cp-team-border: #d4af37;
      --cp-team-on-frame: #ffffff;
      --cp-team-logo-surface: #d4af37;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
      --cp-team-frame: #080808;
      --cp-team-border: #f0c75e;
      --cp-team-on-frame: #ffffff;
      --cp-team-logo-surface: #f0c75e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--cp-team-frame);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.55;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: var(--cp-link); }
    .shell { width: min(calc(100% - 24px), 920px); margin: 0 auto; padding: 20px 0 48px; }
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 52px;
      margin-bottom: 16px;
      padding: 10px 12px;
      background: var(--cp-panel-strong);
      border: 2px solid var(--cp-team-border);
      border-radius: 16px;
      box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
    }
    .topbar h1 { flex: 1; margin: 0; font-size: clamp(1.25rem, 5vw, 1.75rem); }
    .team-logo-tile {
      width: 54px;
      height: 54px;
      flex: 0 0 auto;
      background: var(--cp-team-logo-surface);
      border: 2px solid var(--cp-team-border);
      border-radius: 0.625rem;
      display: grid;
      place-items: center;
      padding: 2px;
      overflow: hidden;
    }
    .team-logo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
    body[data-team="golden-warriors"] .team-logo {
      filter: brightness(0);
    }
    .card {
      background: var(--cp-surface);
      border: 2px solid var(--cp-team-border);
      border-radius: 16px;
      box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
      padding: clamp(18px, 5vw, 32px);
    }
    .unlock { max-width: 520px; margin: 12vh auto 0; }
    .unlock h1 { margin-top: 0; }
    .unlock p { color: var(--cp-text-muted); }
    .field { display: grid; gap: 8px; margin-top: 20px; }
    .field input {
      width: 100%;
      padding: 12px;
      color: var(--cp-text);
      background: var(--cp-bg-elevated);
      border: 1px solid var(--cp-border-strong);
      border-radius: 0.625rem;
    }
    .primary, .secondary {
      border-radius: 0.625rem;
      padding: 10px 14px;
      font-weight: 650;
    }
    .primary {
      margin-top: 12px;
      color: var(--cp-accent-fg);
      background: var(--cp-accent);
      border: 1px solid var(--cp-accent);
    }
    .primary:hover { background: var(--cp-accent-hover); }
    .secondary {
      color: var(--cp-text);
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
    }
    .secondary:disabled { cursor: default; opacity: 0.42; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .week-navigation { display: flex; gap: 8px; }
    .error { min-height: 24px; color: var(--cp-danger); margin-top: 12px; }
    .muted { color: var(--cp-text-muted); }
    .year { margin: 28px 0 12px; font-size: 1.15rem; }
    .plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .plan {
      display: block;
      width: 100%;
      text-align: left;
      color: var(--cp-text);
      background: var(--cp-surface);
      border: 2px solid var(--cp-team-border);
      border-radius: 0.625rem;
      padding: 16px;
    }
    .plan:hover { border-color: var(--cp-accent); background: var(--cp-accent-soft); }
    .plan strong { display: block; font-size: 1.05rem; }
    .plan span { color: var(--cp-text-muted); }
    .year {
      color: var(--cp-team-on-frame);
      padding-bottom: 6px;
      border-bottom: 2px solid var(--cp-team-border);
    }
    .plan:hover {
      color: var(--cp-team-on-frame);
      background: var(--cp-team-frame);
      border-color: var(--cp-team-border);
    }
    .plan:hover span { color: var(--cp-team-border); }
    .document h1 { margin-top: 0; line-height: 1.2; }
    .document h2 { margin-top: 2rem; padding-bottom: 6px; border-bottom: 1px solid var(--cp-border); }
    .document h3 { margin-top: 1.5rem; }
    .document img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 16px auto;
      border-radius: 0.625rem;
    }
    .document table { width: 100%; border-collapse: collapse; overflow-x: auto; display: block; }
    .document th, .document td { border: 1px solid var(--cp-border); padding: 8px; text-align: left; }
    .document blockquote {
      margin-left: 0;
      padding-left: 16px;
      border-left: 4px solid var(--cp-accent);
      color: var(--cp-text-muted);
    }
    .unavailable-link { color: var(--cp-text-muted); }
    .hidden { display: none !important; }
    @media (max-width: 560px) {
      .shell { width: min(calc(100% - 16px), 920px); padding-top: 8px; }
      .topbar { position: sticky; top: 4px; z-index: 2; }
      .team-logo-tile { width: 44px; height: 44px; }
      .topbar { flex-wrap: wrap; }
      .topbar h1 { min-width: calc(100% - 140px); }
      .header-actions { margin-left: auto; }
      .week-navigation { width: 100%; order: 3; }
      .week-navigation .secondary { flex: 1; padding-inline: 8px; }
      .card { padding: 18px; }
    }
  </style>
</head>
<body data-team="golden-warriors">
  <main class="shell">
    <section id="unlock" class="card unlock">
      <h1>Golden Warriors practice plans</h1>
      <p>Open the team link you received, or enter the shared team password.</p>
      <form id="unlock-form">
        <label class="field">
          <span>Team password</span>
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="primary" type="submit">View plans</button>
        <div id="error" class="error" role="alert"></div>
      </form>
    </section>

    <section id="app" class="hidden">
      <header class="topbar">
        <span class="team-logo-tile">
          <img id="team-logo" class="team-logo hidden" alt="Golden Warriors logo">
        </span>
        <h1 id="team-name">Golden Warriors</h1>
        <div class="header-actions">
          <button id="theme-button" class="secondary" type="button">Dark mode</button>
        </div>
        <nav id="week-navigation" class="week-navigation hidden" aria-label="Week navigation">
          <button id="previous-button" class="secondary" type="button">Previous</button>
          <button id="home-button" class="secondary" type="button">Home</button>
          <button id="next-button" class="secondary" type="button">Next</button>
        </nav>
      </header>
      <div id="content"></div>
    </section>
  </main>

  <script>
    const storageKey = `coachplans:${location.pathname}:secret`;
    const unlock = document.getElementById("unlock");
    const app = document.getElementById("app");
    const form = document.getElementById("unlock-form");
    const passwordInput = document.getElementById("password");
    const error = document.getElementById("error");
    const content = document.getElementById("content");
    const weekNavigation = document.getElementById("week-navigation");
    const homeButton = document.getElementById("home-button");
    const previousButton = document.getElementById("previous-button");
    const nextButton = document.getElementById("next-button");
    const themeButton = document.getElementById("theme-button");
    const teamLogo = document.getElementById("team-logo");
    let payload = null;
    let activeSecret = "";
    let activePlanId = "";

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      await unlockWith(passwordInput.value);
    });
    homeButton.addEventListener("click", showHome);
    previousButton.addEventListener("click", () => showAdjacentPlan(-1));
    nextButton.addEventListener("click", () => showAdjacentPlan(1));
    themeButton.addEventListener("click", toggleTheme);
    content.addEventListener("click", (event) => {
      const documentLink = event.target.closest("[data-doc]");
      if (documentLink) {
        event.preventDefault();
        void showDocument(documentLink.dataset.doc, documentLink.dataset.anchor);
        return;
      }
      const planButton = event.target.closest("[data-plan]");
      if (planButton) void showDocument(planButton.dataset.plan);
    });

    updateThemeButton();
    start();

    async function start() {
      const fragmentSecret = decodeURIComponent(location.hash.slice(1));
      const savedSecret = sessionStorage.getItem(storageKey);
      const secret = fragmentSecret || savedSecret;
      if (!secret) {
        passwordInput.focus();
        return;
      }
      await unlockWith(secret, Boolean(fragmentSecret));
    }

    async function unlockWith(secret, removeFragment = false) {
      setError("");
      try {
        const encrypted = await fetchEncrypted("payload.json", "plans");
        payload = await decryptPayload(encrypted, secret);
        activeSecret = secret;
        const encryptedLogo = await fetchEncrypted(payload.team.logoFile, "team logo");
        const logo = await decryptPayload(encryptedLogo, secret);
        teamLogo.src = logo.dataUri;
        teamLogo.classList.remove("hidden");
        sessionStorage.setItem(storageKey, secret);
        if (removeFragment) history.replaceState(null, "", location.pathname + location.search);
        unlock.classList.add("hidden");
        app.classList.remove("hidden");
        const requestedPlan = new URLSearchParams(location.search).get("plan");
        if (requestedPlan && payload.plans.some((plan) => plan.id === requestedPlan)) {
          await showDocument(requestedPlan);
        } else {
          showHome();
        }
      } catch {
        payload = null;
        activeSecret = "";
        sessionStorage.removeItem(storageKey);
        setError("That team password did not work.");
        unlock.classList.remove("hidden");
        app.classList.add("hidden");
        passwordInput.select();
      }
    }

    function showHome() {
      activePlanId = "";
      weekNavigation.classList.add("hidden");
      document.getElementById("team-name").textContent = payload.team.name;
      setPlanQuery("");
      const wrapper = document.createElement("div");
      const years = new Map();
      for (const plan of payload.plans) {
        if (!years.has(plan.year)) years.set(plan.year, []);
        years.get(plan.year).push(plan);
      }
      for (const [year, plans] of years) {
        const heading = document.createElement("h2");
        heading.className = "year";
        heading.textContent = String(year);
        wrapper.append(heading);
        const grid = document.createElement("div");
        grid.className = "plans";
        for (const plan of plans) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "plan";
          button.dataset.plan = plan.id;
          const title = document.createElement("strong");
          title.textContent = `Week ${plan.week}`;
          button.append(title);
          grid.append(button);
        }
        wrapper.append(grid);
      }
      content.replaceChildren(wrapper);
      window.scrollTo({ top: 0 });
    }

    async function showDocument(id, anchor = "") {
      const metadata = payload.documents[id];
      if (!metadata) return;
      const plan = payload.plans.find((candidate) => candidate.id === id);
      activePlanId = plan ? id : "";
      weekNavigation.classList.remove("hidden");
      previousButton.classList.toggle("hidden", !plan);
      nextButton.classList.toggle("hidden", !plan);
      document.getElementById("team-name").textContent = payload.team.name;
      updateWeekNavigation();
      setPlanQuery(plan ? id : "");
      content.innerHTML = '<div class="card muted">Loading plan...</div>';
      try {
        const encrypted = await fetchEncrypted(metadata.file, "plan");
        const documentData = await decryptPayload(encrypted, activeSecret);
        if (documentData.id !== id) throw new Error("The encrypted plan did not match its link.");
        const article = document.createElement("article");
        article.className = "card document";
        article.innerHTML = documentData.html;
        if (plan) article.querySelector("h1")?.remove();
        content.replaceChildren(article);
        if (anchor) {
          requestAnimationFrame(() => document.getElementById(anchor)?.scrollIntoView());
        } else {
          window.scrollTo({ top: 0 });
        }
      } catch (loadError) {
        console.error(loadError);
        const message = document.createElement("div");
        message.className = "card error";
        message.textContent = "This plan could not be loaded. Return to the team home page and try again.";
        content.replaceChildren(message);
      }
    }

    function showAdjacentPlan(offset) {
      const plans = [...payload.plans].sort((a, b) => a.year - b.year || a.week - b.week);
      const index = plans.findIndex((plan) => plan.id === activePlanId);
      const target = plans[index + offset];
      if (target) void showDocument(target.id);
    }

    function updateWeekNavigation() {
      const plans = [...payload.plans].sort((a, b) => a.year - b.year || a.week - b.week);
      const index = plans.findIndex((plan) => plan.id === activePlanId);
      previousButton.disabled = index <= 0;
      nextButton.disabled = index < 0 || index >= plans.length - 1;
    }

    function setPlanQuery(planId) {
      const url = new URL(location.href);
      if (planId) {
        url.searchParams.set("plan", planId);
      } else {
        url.searchParams.delete("plan");
      }
      history.replaceState(null, "", url.pathname + url.search);
    }

    function toggleTheme() {
      const theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = theme;
      try {
        localStorage.setItem("coachplans:theme", theme);
      } catch {}
      updateThemeButton();
    }

    function updateThemeButton() {
      const dark = document.documentElement.dataset.theme === "dark";
      themeButton.textContent = dark ? "Light mode" : "Dark mode";
      themeButton.setAttribute("aria-pressed", String(dark));
    }

    async function decryptPayload(encrypted, secret) {
      const encoder = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        encoder.encode(secret),
        "PBKDF2",
        false,
        ["deriveKey"],
      );
      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          hash: "SHA-256",
          salt: fromBase64(encrypted.salt),
          iterations: encrypted.iterations,
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"],
      );
      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: fromBase64(encrypted.iv), tagLength: 128 },
        key,
        fromBase64(encrypted.data),
      );
      return JSON.parse(new TextDecoder().decode(decrypted));
    }

    async function fetchEncrypted(file, description) {
      const response = await fetch(file, { cache: "no-store" });
      if (!response.ok) throw new Error(`Unable to load the encrypted ${description}.`);
      return response.json();
    }

    function fromBase64(value) {
      return Uint8Array.from(atob(value), (character) => character.charCodeAt(0));
    }

    function setError(message) {
      error.textContent = message;
    }
  </script>
</body>
</html>
